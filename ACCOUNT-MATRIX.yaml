version: 1
updated: '2026-08-02'
description: >-
  Non-secret inventory of account families and platform identities. A planned
  row is an intended account slot, not proof that the external account exists.

status_definitions:
  active: Configured and available for normal operation.
  setup: Configuration or credentials are being prepared.
  planned: Intended but not confirmed as created.
  needs-verification: Platform use is documented but exact account or handle is unconfirmed.
  paused: Intentionally disabled while its record is retained.
  retired: No longer used; historical record retained.

